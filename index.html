<style>
:root{
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#eceee9; --ink:#1b2430; --ink2:#4b5563; --muted:#7a8290;
  --line:#d9dcd4; --accent:#1f4e8c; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --warn:#9a6a00; --warn-soft:#fbf0d4; --bad:#b3261e; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#12161c;--surface:#1a2029;--surface2:#222a35;--ink:#e6e9ee;--ink2:#b3bac6;--muted:#8a93a2;
  --line:#2e3744;--accent:#7aa7e6;--accent-ink:#0e1520;--accent-soft:#1f2d42;
  --ok:#5fc592;--ok-soft:#173027;--warn:#e0b44a;--warn-soft:#332a14;--bad:#f08a80;--bad-soft:#3a1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#12161c;--surface:#1a2029;--surface2:#222a35;--ink:#e6e9ee;--ink2:#b3bac6;--muted:#8a93a2;
  --line:#2e3744;--accent:#7aa7e6;--accent-ink:#0e1520;--accent-soft:#1f2d42;
  --ok:#5fc592;--ok-soft:#173027;--warn:#e0b44a;--warn-soft:#332a14;--bad:#f08a80;--bad-soft:#3a1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;padding:0 10px 4px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:500}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.navbtn .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:10px 4px}
.side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 10px}
main{padding-block:24px 60px;padding-inline:28px;min-width:0}
h1{font-family:var(--serif);font-size:26px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--serif);font-size:18px;margin:0 0 10px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.sub{color:var(--ink2);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-family:var(--mono);font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);cursor:pointer;user-select:none}
th.nosort{cursor:default}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.fed{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.filters input[type=search]{min-width:240px;flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500}
label.f input,label.f select,label.f textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:13.5px;color:var(--ink);width:100%}
label.f textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin:0 0 16px;background:var(--surface)}
legend{font-family:var(--serif);font-weight:700;font-size:15px;padding:0 6px}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 22px}
.dl div .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.dl div .v{margin-top:2px;word-break:break-word}
.casc{width:100%;font-size:13.5px}
.casc td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.casc tr.tot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cmp .c{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.cmp .c.hl{border-color:var(--bad);background:var(--bad-soft)}
.cmp .c .v{font-family:var(--mono);font-size:19px;margin:4px 0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border-left:3px solid;margin-bottom:8px;font-size:13px}
.alert.alta{background:var(--bad-soft);border-color:var(--bad)}
.alert.media{background:var(--warn-soft);border-color:var(--warn)}
.alert.baixa{background:var(--surface2);border-color:var(--muted)}
.alert b{display:block}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:var(--surface2);border-radius:10px;min-width:250px;width:250px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - 170px)}
.col.over{outline:2px dashed var(--accent)}
.colh{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.colh .mono{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:400}
.cards{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;box-shadow:var(--shadow)}
.card .t{font-weight:600;font-size:13px;margin-bottom:3px}
.card .m{font-size:12px;color:var(--ink2)}
.card select{margin-top:8px;width:100%;font-size:12px;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);margin-bottom:16px;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.subtable{width:100%;font-size:13px;margin-bottom:8px}
.subtable td,.subtable th{padding:6px;border-bottom:1px solid var(--line)}
.subtable input,.subtable select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px;min-width:80px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50}
.modalbg{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.note{border-left:2px solid var(--line);padding:2px 0 8px 12px;margin-bottom:6px}
.note .d{font-size:11.5px;color:var(--muted)}
.tag-ex{font-size:10.5px;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.side .sep,.side .foot{display:none}
  .navbtn{width:auto;white-space:nowrap}
  .navbtn .count{display:none}
  main{padding-inline:16px}
  .two{grid-template-columns:1fr}
  .filters input[type=search]{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = v => (v == null || !isFinite(v)) ? "—" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const brlc = v => { if (v == null || !isFinite(v)) return "—"; const a = Math.abs(v);
  if (a >= 1e9) return "R$ " + (v/1e9).toLocaleString("pt-BR",{maximumFractionDigits:2}) + " bi";
  if (a >= 1e6) return "R$ " + (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:2}) + " mi";
  if (a >= 1e3) return "R$ " + (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:0}) + " mil";
  return brl(v); };
const pct = (v, d = 2) => (v == null || !isFinite(v)) ? "—" : v.toLocaleString("pt-BR", {minimumFractionDigits:d, maximumFractionDigits:d}) + "%";
const fdate = s => s ? String(s).slice(0,10).split("-").reverse().join("/") : "—";
const fnumIn = n => (n == null || n === "" || !isFinite(n)) ? "" : Number(n).toLocaleString("pt-BR", {maximumFractionDigits:4});
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const todayISO = () => new Date().toISOString().slice(0, 10);
const curKey = () => todayISO().slice(0, 7);
function parseNum(s) {
  if (typeof s === "number") return isFinite(s) ? s : null;
  s = String(s ?? "").trim().replace(/R\$|\s|%/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = parseFloat(s); return isNaN(n) ? null : n;
}
function parseDate(s) {
  s = String(s ?? "").trim(); if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})\/(\d{4})$/); if (m) return `${m[2]}-${m[1].padStart(2,"0")}-01`;
  return null;
}
const parseBool = s => ["sim","s","true","1","x","yes"].includes(norm(s));
function maskDoc(d) { d = String(d || ""); const digits = d.replace(/\D/g, "");
  if (digits.length === 11) return "***." + digits.slice(3,6) + "." + digits.slice(6,9) + "-**";
  return d; }
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ============ regras jurídicas (versionadas) ============ */
const ETAPAS_BASE = [
  {id:"mapeado", nome:"Mapeado", cor:"#7a8290"},
  {id:"analise", nome:"Em análise", cor:"#1f4e8c"},
  {id:"contatado", nome:"Titular contatado", cor:"#4f63c9"},
  {id:"oferecido", nome:"Oferecido ao fundo", cor:"#8a5cc2"},
  {id:"exclusividade", nome:"Exclusividade assinada", cor:"#c27a1f"},
  {id:"dd", nome:"Due diligence", cor:"#a8820e"},
  {id:"cessao", nome:"Cessão assinada", cor:"#2e8b57"},
  {id:"concluido", nome:"Concluído", cor:"#1f7a4d", final:true},
  {id:"perdido", nome:"Perdido", cor:"#b3261e", final:true},
];
// Art. 100, §23, CF (EC 136/2025): estoque/RCL -> % mínimo da RCL
const FAIXAS_23 = [[15,1.0,"I"],[25,1.5,"II"],[35,2.0,"III"],[45,2.5,"IV"],[55,3.0,"V"],[65,3.5,"VI"],[75,4.0,"VII"],[85,4.5,"VIII"],[Infinity,5.0,"IX"]];
const faixa23 = r => FAIXAS_23.find(f => r <= f[0]);
const ADJ_2AA = (Math.pow(1.02, 1/12) - 1) * 100; // 2% a.a. em taxa mensal
const REGRAS = [
  {de:"2021-12", ate:"2025-07", nome:"SELIC — art. 3º EC 113/2021", metodo:"soma simples das taxas mensais"},
  {de:"2025-08", ate:null, nome:"IPCA + 2% a.a., limitado à SELIC — EC 136/2025 (sub judice: ADI 7873)", metodo:"soma simples; teto aplicado mês a mês [VERIFICAR]"},
];
const TIPOS_DED = {DESTAQUE_CONTRATUAL:"Destaque de honorários contratuais", SUCUMBENCIAIS:"Honorários sucumbenciais", IR:"Imposto de renda", INSS:"Contribuição previdenciária", ISS:"ISSQN", CESSAO_ANTERIOR:"Cessão anterior", OUTRA:"Outra"};
const TIPOS_RISCO = ["PENHORA","DIVIDA_ATIVA","RECUPERACAO_JUDICIAL","ESPOLIO_SOCIO","CERTIDAO_DESATUALIZADA","TEMA_1349","ADI_7873","SEGREDO_JUSTICA","DADOS_SENSIVEIS","OUTRO"];
const TRIBUNAIS = ["TJSC","TRF1","TJMG","TRF4","TRF6","Outro"];

/* ============ estado ============ */
const S = { db:null, dl:null, modo:"carregando", precs:[], etapas:ETAPAS_BASE.slice(), etapasSalvas:false,
  selic:{}, ipca:{}, idxMeta:{}, view:"painel", id:null, tab:"resumo", draft:null,
  f:{q:"", esfera:"", tribunal:"", natureza:"", regime:"", etapa:""}, sort:{k:"atualizado", dir:-1}, showDoc:false, imp:null };

const etapaDe = id => S.etapas.find(e => e.id === id) || {id, nome:id || "Sem etapa", cor:"#7a8290"};
const titularNome = p => (p.titulares && p.titulares[0] && p.titulares[0].nome) || "—";

/* ============ cálculos ============ */
function nextKey(k) { let [y, m] = k.split("-").map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${String(m).padStart(2,"0")}`; }
function correcao(p) {
  if (p.valor_atualizado_informado) return {modo:"informado", bruto:p.valor_atualizado_informado, ref:p.data_valor_atualizado};
  if (!p.valor_face || !p.data_base) return {modo:"sem", motivo:"Informe o valor de face e a data-base para estimar a correção."};
  const dbk = p.data_base.slice(0, 7);
  if (dbk < "2021-12") return {modo:"sem", motivo:"Data-base anterior a 12/2021: o índice até 08/12/2021 varia por tema (810/STF, 905/STJ). Informe o valor atualizado pela conta do Tribunal."};
  let k = nextKey(dbk), soma = 0, linhas = [], ate = null, ck = curKey(), parou = null;
  while (k < ck) {
    const se = S.selic[k];
    if (se == null) { parou = k; break; }
    let taxa, regra;
    if (k >= "2025-08") {
      const ip = S.ipca[k];
      if (ip == null) { parou = k; break; }
      const t = ip + ADJ_2AA;
      if (t < se) { taxa = t; regra = "IPCA+2%"; } else { taxa = se; regra = "SELIC (teto)"; }
    } else { taxa = se; regra = "SELIC"; }
    soma += taxa; linhas.push({k, selic:se, ipca:S.ipca[k], taxa, regra}); ate = k; k = nextKey(k);
  }
  if (!linhas.length) return {modo:"sem", motivo:"Sem série de índices para o período. Confira a tela Índices."};
  return {modo:"estimado", pct:soma, bruto:p.valor_face * (1 + soma / 100), ate, linhas, parou};
}
function cascata(p, bruto) {
  const rows = []; let tot = 0;
  for (const d of (p.deducoes || [])) {
    const base = d.base === "FACE" ? (p.valor_face || 0) : bruto;
    const v = (d.valor != null && d.valor !== "") ? Number(d.valor) : base * (Number(d.percentual) || 0) / 100;
    rows.push({...d, calc:v}); tot += v;
  }
  return {rows, total:tot, liquido:bruto - tot};
}
function analise(p) {
  const c = correcao(p);
  const out = {c};
  if (!c.bruto) return out;
  const k = cascata(p, c.bruto); out.k = k; out.liq = k.liquido;
  const anoPag = p.ano_pagamento ? Number(p.ano_pagamento) : (p.exercicio ? Number(p.exercicio) : null);
  out.anoPag = anoPag;
  out.anos = anoPag ? Math.max(0.25, (new Date(anoPag, 11, 31) - new Date()) / (365.25 * 864e5)) : null;
  out.taxa = p.taxa_proj != null ? p.taxa_proj : 6.5;
  out.naFila = out.anos ? out.liq * Math.pow(1 + out.taxa / 100, out.anos) : null;
  out.desAc = p.desagio_acordo != null ? p.desagio_acordo : 35;
  out.acordo = out.liq * (1 - out.desAc / 100);
  out.proposta = p.proposta_fundo || null;
  out.cresc = (out.proposta && out.naFila && out.anos) ? Math.pow(out.naFila / out.proposta, 1 / out.anos) - 1 : null;
  const cv = Number(p.comissao_valor) || 0;
  out.comissao = !cv ? null : p.comissao_tipo === "fixo" ? cv
    : p.comissao_tipo === "pct_face" ? (p.valor_face || 0) * cv / 100

    : (out.proposta ? out.proposta * cv / 100 : null);
  return out;
}
function prazoFila(p) {
  const e = Number(p.fila_estoque), r = Number(p.fila_rcl), f = Number(p.fila_soma_frente);
  if (!e || !r) return null;
  const ratio = e / r * 100, fx = faixa23(ratio), cota = r * fx[1] / 100;
  return {ratio, faixa:fx[2], perc:fx[1], cota, anos: f ? f / cota : null, cobre: cota / e};
}
function alertas(p, a) {
  a = a || analise(p); const L = [];
  if (p.superpreferencia) L.push(["alta","Superpreferência não se transfere","Art. 100, §2º, CF e art. 42, §2º, Res. CNJ 303/2019. O fundo não herda a antecipação: precifique pela fila " + (p.natureza === "ALIMENTAR" ? "alimentar" : "comum") + "."]);
  if (p.segredo_justica) L.push(["alta","Segredo de justiça","Só dados de capa podem circular. Nada dos autos vai ao fundo."]);
  if (a.proposta && a.acordo && a.proposta < a.acordo) L.push(["alta","Proposta do fundo abaixo do acordo direto", `O titular recebe ${brl(a.acordo)} no acordo direto (art. 100, §29, CF) contra ${brl(a.proposta)} do fundo. Nenhum argumento fecha isso: a conversa é com o fundo.`]);
  if (a.cresc != null && a.cresc > 0.35) L.push(["alta","Preço provavelmente baixo demais", `Nesse preço o dinheiro do fundo cresce ${pct(a.cresc*100,1)} ao ano (mercado busca 20% a 25%). Tende a não fechar e expõe a lesão (art. 157 CC).`]);
  else if (a.cresc != null && a.cresc < 0.15) L.push(["media","Retorno do fundo abaixo do usual", `Nesse preço o dinheiro do fundo cresce só ${pct(a.cresc*100,1)} ao ano. O fundo tende a recusar.`]);
  for (const d of (p.deducoes || [])) {
    if (d.valor && p.valor_face) { const r = d.valor / p.valor_face * 100;
      if (r >= 0.5 && Math.abs(r * 2 - Math.round(r * 2)) < 0.0005) L.push(["media","Possível dupla contagem", `${TIPOS_DED[d.tipo] || d.tipo}: ${brl(d.valor)} é exatamente ${pct(r)} da face. Confira na decisão de liquidação se já está dentro do valor de face.`]); }
  }
  const somaTit = (p.titulares || []).reduce((s, t) => s + (Number(t.percentual) || 0), 0);
  if (somaTit && Math.abs(somaTit - 100) > 0.01) L.push(["media","Percentuais dos titulares não somam 100%", `Soma atual: ${pct(somaTit)}.`]);
  if (p.ente_concordou !== "sim") L.push(["media","Concordância do ente não confirmada","É o documento mais valioso do dossiê. Localize a petição de concordância ou a certidão de ausência de impugnação."]);
  if (!p.data_base) L.push(["media","Data-base ausente","Sem ela não há correção. Atenção: data-base não é a data da conta."]);
  if (p.regime === "ESPECIAL" && !p.ano_pagamento) L.push(["media","Prazo de pagamento não estimado","Regime especial não tem prazo legal. Preencha estoque, RCL e soma à frente na aba Valores."]);
  if (a.c && a.c.modo === "estimado" && a.c.ate >= "2025-08") L.push(["baixa","Correção depende da EC 136/2025","Meses a partir de 08/2025 usam IPCA + 2% a.a. limitado à SELIC, regra atacada na ADI 7873."]);
  if (a.c && a.c.modo === "estimado") L.push(["baixa","Valor bruto é estimativa","Confira contra o valor da listagem ou da conta homologada e, se divergir, informe o valor atualizado."]);
  if (!(p.titulares || []).length) L.push(["media","Titular a identificar","Consulte o número do precatório no processo para descobrir titular e advogados. As listagens públicas não trazem o nome (art. 12, §3º, Res. CNJ 303/2019)."]);
  if (!(p.advogados || []).length) L.push(["baixa","Advogados não cadastrados","Se houver advogado com destaque ou requisição própria, ele precisa de instrumento simultâneo."]);
  if (/^TRF/.test(p.tribunal || "")) L.push(["baixa","Precatório federal","Regras e fontes federais ainda em verificação pela equipe."]);
  for (const r of (p.riscos || [])) if (!r.resolvido) L.push([r.severidade || "media", (r.tipo || "Risco").replace(/_/g, " "), r.descricao || ""]);
  return L;
}
const nAltos = L => L.filter(x => x[0] === "alta").length;

/* ============ persistência ============ */
async function salvarPrec(p) {
  p.atualizado = new Date().toISOString(); if (S.usuario) p.atualizado_por = S.usuario.email;
  const i = S.precs.findIndex(x => x.id === p.id);
  if (i >= 0) S.precs[i] = p; else S.precs.push(p);
  if (S.db) { try { await S.db.collection("precatorios").doc(p.id).set(JSON.parse(JSON.stringify(p))); }
    catch (e) { toast("Não foi possível salvar: " + (e.code || e.message)); return false; } }
  return true;
}
async function excluirPrec(id) {
  S.precs = S.precs.filter(x => x.id !== id);
  if (S.db) { try { await S.db.collection("precatorios").doc(id).delete(); } catch (e) { toast("Falha ao excluir: " + (e.code || e.message)); } }
}
async function salvarEtapas() {
  S.etapasSalvas = true;
  if (S.db) { try { await S.db.doc("config/etapas").set({lista:S.etapas}); } catch (e) { toast("Falha ao salvar etapas"); } }
}
async function salvarIndices() {
  if (S.db) { try { await S.db.doc("indices/serie").set({selic:S.selic, ipca:S.ipca, fonte:S.idxMeta.fonte || "Manual", coleta:todayISO()}); } catch (e) { toast("Falha ao salvar índices"); } }
}

/* ============ painel ============ */

  const an = P.map(p => ({p, a:analise(p)})); an.forEach(x => x.L = alertas(x.p, x.a));
  const ativos = an.filter(x => !etapaDe(x.p.etapa).final);

/* ============ lista ============ */
function filtrar() {
  const f = S.f, q = norm(f.q);
  let L = S.precs.filter(p => (!f.esfera || p.esfera === f.esfera) && (!f.tribunal || p.tribunal === f.tribunal) && (!f.natureza || p.natureza === f.natureza)
    && (!f.regime || p.regime === f.regime) && (!f.etapa || p.etapa === f.etapa)
    && (!q || norm([p.numero_precatorio, p.ente_devedor, p.processo_origem, p.processo_cumprimento, p.tipo_acao, ...(p.titulares || []).map(t => t.nome + " " + (t.documento || "")), ...(p.advogados || []).map(a => a.nome + " " + (a.oab || ""))].join(" ")).includes(q)));
  const k = S.sort.k, d = S.sort.dir;
  const val = p => k === "titular" ? titularNome(p) : k === "etapa" ? S.etapas.findIndex(e => e.id === p.etapa) : p[k];
  L.sort((a, b) => { const x = val(a), y = val(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR")) * d; });
  return L;
}

  ${L.map(p => { const L2 = alertas(p), e = etapaDe(p.etapa), na = nAltos(L2), nm = L2.filter(x => x[0]==="media").length;

    <div class="c"><h3>(b) Acordo direto — art. 100, §29</h3><div class="v">${brl(a.acordo)}</div><div class="hint">renúncia de ${pct(a.desAc, 0)} sobre o líquido; paga até o fim do exercício seguinte${p.regime !== "ESPECIAL" ? ". Atenção: §29 é do regime especial" : ""}</div></div>

function novoDraft() {

function inp(path, label, opts = {}) {
  const v = getPath(S.draft, path); const t = opts.t || "text";
  const val = t === "num" ? fnumIn(v) : (v ?? "");
  if (opts.sel) return `<label class="f ${opts.wide ? "wide" : ""}">${label}<select data-p="${path}" data-t="${t}">${opts.sel.map(o => `<option value="${esc(o[0])}" ${String(v ?? "") === String(o[0]) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>${opts.h ? `<span class="hint">${opts.h}</span>` : ""}</label>`;
  if (t === "bool") return `<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-p="${path}" data-t="bool" ${v ? "checked" : ""} style="width:auto">${label}</label>`;
  if (t === "area") return `<label class="f wide">${label}<textarea data-p="${path}" data-t="text">${esc(val)}</textarea></label>`;
  return `<label class="f ${opts.wide ? "wide" : ""}">${label}<input data-p="${path}" data-t="${t}" ${t === "date" ? 'type="date"' : ""} ${t === "num" ? 'inputmode="decimal"' : ""} value="${esc(val)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ""}>${opts.h ? `<span class="hint">${opts.h}</span>` : ""}</label>`;
}
function getPath(o, p) { return p.split(".").reduce((x, k) => x == null ? x : x[k], o); }
function setPath(o, p, v) { const ks = p.split("."); let x = o; for (let i = 0; i < ks.length - 1; i++) x = x[ks[i]]; x[ks[ks.length - 1]] = v; }
function subRows(key, cols, addLabel) {
  const rows = S.draft[key] || [];
  return `<div style="overflow-x:auto"><table class="subtable"><thead><tr>${cols.map(c => `<th class="nosort">${c[1]}</th>`).join("")}<th class="nosort"></th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr>${cols.map(c => { const path = `${key}.${i}.${c[0]}`, v = r[c[0]];
    if (c[2] === "sel") return `<td><select data-p="${path}" data-t="text">${c[3].map(o => `<option value="${o[0]}" ${v === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></td>`;
    if (c[2] === "bool") return `<td style="text-align:center"><input type="checkbox" data-p="${path}" data-t="bool" ${v ? "checked" : ""} style="width:auto;min-width:0"></td>`;
    return `<td><input data-p="${path}" data-t="${c[2] || "text"}" ${c[2] === "num" ? 'inputmode="decimal"' : ""} value="${esc(c[2] === "num" ? fnumIn(v) : (v ?? ""))}"></td>`; }).join("")}
    <td><button type="button" class="btn sm danger" data-rm="${key}" data-i="${i}" aria-label="Remover">×</button></td></tr>`).join("")}
  </tbody></table></div><button type="button" class="btn sm" data-add="${key}">+ ${addLabel}</button>`;
}

function classificaEnte(nome) {
  const orig = String(nome || "").replace(/[\s_.]+$/, ""), k = norm(orig);
  const R = (n, t) => ({nome:n, tipo:t, orig});
  if (k.includes("encargosfinanceirosdauniao")) return R("União Federal", "União (administração direta)");
  if (k.includes("fundodoregimegeraldeprevidencia") || k.includes("institutonacionaldosegurosocial")) return R("INSS", "Autarquia federal");
  if (k.includes("fundonacionaldeassistenciasocial")) return R("União Federal (FNAS)", "União (fundo)");
  if (k.includes("fundodeamparoaotrabalhador")) return R("União Federal (FAT)", "União (fundo)");
  if (k.includes("fundonacionaldesaude")) return R("União Federal (FNS)", "União (fundo)");
  if (k.startsWith("valec")) return R(orig, "Empresa pública federal");

}
async function carregarListagens() {

    const q = await S.db.collection("listagem_itens").limit(1000).get();
    const out = [];
    for (const d of q.docs) { const b = d.data(); const m = lmetaDe(b.listagem); if (!m) continue;
      const cl = m.entidades.map(x => m.esfera === "FEDERAL" ? classificaEnte(x) : {nome:String(x).replace(/[\s_.]+$/, ""), tipo:"", orig:String(x)}); for (const r of b.rows) out.push({num:r[0], ent:cl[r[1]].nome, entTipo:cl[r[1]].tipo, entOrig:cl[r[1]].orig, entN:norm(cl[r[1]].nome), nat:r[2], pref:r[3], ordem:r[4], data:r[5], valor:r[6], lista:m.id}); }
    S.lrows = out; S.lcarreg = true; if (S.view === "pesquisa") render();

}
function filtrarListagens() {
  const f = S.lf, q = (f.num || "").replace(/\D/g, ""), en = norm(f.ente);
  const naCart = new Set(S.precs.map(p => String(p.numero_precatorio || "").replace(/\D/g, "")));
  const R = S.lrows.filter(r => (!f.lista || r.lista === f.lista) && (f.faceMin == null || r.valor >= f.faceMin) && (f.faceMax == null || r.valor <= f.faceMax)
    && (!en || r.entN === en) && (!f.tipoEnte || r.entTipo === f.tipoEnte) && (f.natureza === "" || String(r.nat) === f.natureza)
    && (f.pref === "" || (f.pref === "sem" ? r.pref === 0 : String(r.pref) === f.pref)) && (!q || r.num.includes(q)) && (!f.naoCarteira || !naCart.has(r.num)));
  const k = S.lsort.k, d = S.lsort.dir;
  const key = {6:"valor", 4:"ordem", 5:"data", 1:"entN"}[k] || "valor";
  R.sort((a, b) => (typeof a[key] === "number" ? a[key] - b[key] : a[key].localeCompare(b[key])) * d);
  return {R, naCart};
}

      data_apresentacao:`${String(r.data).slice(0,4)}-${String(r.data).slice(4,6)}-${String(r.data).slice(6,8)}`, titulares:[], origem_listagem:m.id,

/* ============ cópia de segurança ============ */
const COLS_BACKUP = ["precatorios", "listagens", "listagem_itens", "config", "indices"];
async function gerarBackup() {
  if (!S.db) return toast("Sem conexão com os dados");
  toast("Gerando cópia…");
  const out = {versao:1, gerado:new Date().toISOString(), docs:{}};
  for (const c of COLS_BACKUP) { const q = await S.db.collection(c).limit(1000).get(); out.docs[c] = q.docs.map(d => ({id:d.id, data:d.data()})); }
  const n = Object.values(out.docs).reduce((s, a) => s + a.length, 0);
  await oferecerArquivo(`backup_mesa_precatorios_${todayISO()}.json`, JSON.stringify(out), true);
  return n;
}
async function restaurarBackup(file) {
  let b; try { b = JSON.parse(await file.text()); } catch (e) { return toast("Arquivo de cópia inválido"); }
  if (!b || !b.docs) return toast("Arquivo de cópia inválido");
  let n = 0; const tot = Object.values(b.docs).reduce((s, a) => s + a.length, 0);
  for (const c of COLS_BACKUP) for (const d of (b.docs[c] || [])) { await S.db.collection(c).doc(d.id).set(d.data); n++; if (n % 5 === 0) toast(`Restaurando ${n}/${tot}…`); }
  toast(`${n} registro(s) restaurado(s)`); S.lcarreg = false; carregarListagens(); render();
}
function vBackup() {
  return `<div class="panel" style="margin-top:16px"><h3>Cópia de segurança</h3>
  <p>Baixa tudo (carteira, etapas, pesquisas salvas, índices e listagens) num único arquivo. Serve para guardar uma cópia e para levar os dados para outra instalação do app.</p>
  <div class="row"><button class="btn" id="bkBaixar">Baixar cópia completa</button>
  <label class="btn" style="cursor:pointer">Restaurar de um arquivo<input type="file" id="bkArq" accept=".json" hidden></label></div>
  <p class="hint">Restaurar grava por cima dos registros com o mesmo identificador e mantém os demais.</p></div>`;
}
document.addEventListener("click", ev => { const t = ev.target.closest("#bkBaixar"); if (t) gerarBackup(); });
document.addEventListener("change", ev => { if (ev.target.id === "bkArq" && ev.target.files[0]) restaurarBackup(ev.target.files[0]); });

/* ============ inicialização ============ */
function iniciarDados(db) {
  db.collection("precatorios").onSnapshot(snap => { S.precs = snap.docs.map(d => ({id:d.id, ...d.data()})); if (S.view !== "novo" && S.view !== "editar") render(); else renderNav(); },
    e => { toast("Conexão com os dados perdida"); });
  db.doc("config/etapas").onSnapshot(s => { if (s.exists && Array.isArray(s.data().lista) && s.data().lista.length) { S.etapas = s.data().lista.map(e => ({...e})); S.etapasSalvas = true; }
    if (!["novo","editar","config"].includes(S.view)) render(); });
  db.doc("config/pesquisas").onSnapshot(s => { S.pesqSalvas = s.exists && Array.isArray(s.data().lista) ? s.data().lista.map(x => ({nome:x.nome, filtros:{...x.filtros}})) : []; if (S.view === "pesquisa") render(); });
  db.collection("listagens").onSnapshot(s => { const antes = S.lmeta.map(m => m.id + m.qtd).join(); S.lmeta = s.docs.map(d => ({...d.data(), id:d.id})); if (S.lmeta.map(m => m.id + m.qtd).join() !== antes) { S.lcarreg = false; carregarListagens(); } if (S.view === "pesquisa") render(); });
  db.doc("indices/serie").onSnapshot(s => { if (s.exists) { const d = s.data(); S.selic = {...(d.selic || {})}; S.ipca = {...(d.ipca || {})}; S.idxMeta = {fonte:d.fonte, coleta:d.coleta}; }
    if (!["novo","editar"].includes(S.view)) render(); });
}

/* ============ conexão com o banco (Supabase) ============ */
function criarDb(sb, userId) {
  const subs = new Set(); const pend = {};
  const erro = e => ({code:"unavailable", message:e && e.message || String(e)});
  const snapDoc = (id, data) => ({id, exists:data != null, data:() => data == null ? undefined : data, metadata:{fromCache:false, hasPendingWrites:false}});
  async function lerDoc(c, id) { const {data, error} = await sb.from("docs").select("id,data").eq("collection", c).eq("id", id).maybeSingle(); if (error) throw erro(error); return snapDoc(id, data ? data.data : null); }
  async function lerCol(c) {
    const docs = []; let de = 0; const passo = c === "listagem_itens" ? 5 : 500;
    for (;;) { const {data, error} = await sb.from("docs").select("id,data").eq("collection", c).order("id").range(de, de + passo - 1); if (error) throw erro(error);
      docs.push(...data.map(r => snapDoc(r.id, r.data))); if (data.length < passo) break; de += passo; }
    return {docs, size:docs.length, empty:!docs.length, docChanges:() => [], metadata:{fromCache:false, hasPendingWrites:false}};
  }
  function avisar(c) { clearTimeout(pend[c]); pend[c] = setTimeout(() => { for (const s of subs) if (s.c === c) s.run(); }, 250); }
  function refDoc(c, id) { return {id, path:c + "/" + id, get:() => lerDoc(c, id),
    set:async d => { const {error} = await sb.from("docs").upsert({collection:c, id, data:d, updated_at:new Date().toISOString()}); if (error) throw erro(error); avisar(c); },
    update:async d => { const s = await lerDoc(c, id); if (!s.exists) throw {code:"invalid_argument", message:"documento não existe"}; return refDoc(c, id).set({...s.data(), ...d}); },
    delete:async () => { const {error} = await sb.from("docs").delete().eq("collection", c).eq("id", id); if (error) throw erro(error); avisar(c); },
    onSnapshot(next, err) { const s = {c, run:() => lerDoc(c, id).then(next, e => err && err(e))}; subs.add(s); s.run(); return () => subs.delete(s); } }; }
  function refCol(c) { return {path:c, doc:id => refDoc(c, id || uid()), limit:() => refCol(c), orderBy:() => refCol(c), where:() => refCol(c), get:() => lerCol(c),
    add:async d => { const r = refDoc(c, uid()); await r.set(d); return r; },
    onSnapshot(next, err) { const s = {c, run:() => lerCol(c).then(next, e => err && err(e))}; subs.add(s); s.run(); return () => subs.delete(s); } }; }
  window.addEventListener("focus", () => { for (const s of subs) if (s.c !== "listagem_itens") s.run(); });
  return {doc:p => { const [c, id] = p.split("/"); return refDoc(c, id); }, collection:c => refCol(c)};
}
const baixarArquivo = {save:async ({filename, data}) => { const url = URL.createObjectURL(new Blob([data])); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return {status:"saved"}; }};

/* ============ entrada ============ */
function telaLogin(msg) {
  $("#nav").innerHTML = `<div class="brand">Mesa de Precatórios<small>Mapeamento e negociação</small></div>`;
  $("#main").innerHTML = `<div class="panel" style="max-width:380px;margin:40px auto">
    <h1 style="font-size:22px">Entrar</h1><p class="sub">Acesso restrito aos sócios.</p>
    <form id="login" class="grid">
      <label class="f">E-mail<input id="lgEmail" type="email" autocomplete="username" required></label>
      <label class="f">Senha<input id="lgSenha" type="password" autocomplete="current-password" required minlength="8"></label>
      <button class="btn primary" type="submit">Entrar</button>
      <button class="btn" type="button" id="lgCriar">Primeiro acesso: criar senha</button>
      <button class="btn sm" type="button" id="lgEsqueci" style="border:0">Esqueci a senha</button>
      ${msg ? `<div class="alert media"><div>${esc(msg)}</div></div>` : ""}
    </form></div>`;
}
async function entrar(sb) {
  const {data} = await sb.auth.getSession();
  if (!data.session) { telaLogin(); return; }
  S.usuario = data.session.user;
  S.db = criarDb(sb, S.usuario.id); S.dl = baixarArquivo; S.modo = "db";
  iniciarDados(S.db); render();
  semearBasePublica(sb).catch(e => toast("Falha ao carregar a base pública: " + (e.message || e)));
}
async function semearBasePublica(sb) {
  const {count, error} = await sb.from("docs").select("id", {count:"exact", head:true}).eq("collection", "listagens");
  if (error || count) return;
  toast("Primeiro acesso: carregando as listagens dos tribunais…");
  const b = await (await fetch("dados/base_publica.json", {cache:"no-store"})).json();
  const lotes = [];
  for (const c of ["indices", "listagem_itens", "listagens"]) for (const d of (b.docs[c] || [])) lotes.push({collection:c, id:d.id, data:d.data, updated_at:new Date().toISOString()});
  for (let i = 0; i < lotes.length; i += 3) { const {error:e} = await sb.from("docs").upsert(lotes.slice(i, i + 3)); if (e) throw e; }
  const q = await S.db.collection("listagens").get(); S.lmeta = q.docs.map(d => ({...d.data(), id:d.id}));
  const ix = await S.db.doc("indices/serie").get(); if (ix.exists) { const d = ix.data(); S.selic = {...d.selic}; S.ipca = {...d.ipca}; S.idxMeta = {fonte:d.fonte, coleta:d.coleta}; }
  S.lcarreg = false; await carregarListagens(); toast("Listagens carregadas"); render();
}
function iniciarWeb() {
  if (!window.supabase || !SUPA_URL || SUPA_URL.includes("__")) { $("#main").innerHTML = `<div class="panel empty">App ainda não configurado: falta o endereço do banco de dados.</div>`; return; }
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY); window._sb = sb;
  document.addEventListener("submit", async ev => { if (ev.target.id !== "login") return; ev.preventDefault();
    const {error} = await sb.auth.signInWithPassword({email:$("#lgEmail").value.trim(), password:$("#lgSenha").value});
    if (error) return telaLogin(error.message.includes("Invalid") ? "E-mail ou senha incorretos." : error.message.includes("confirm") ? "Confirme o e-mail pelo link que você recebeu e tente de novo." : error.message);
    entrar(sb); });
  document.addEventListener("click", async ev => {
    if (ev.target.id === "lgCriar") { const email = $("#lgEmail").value.trim(), senha = $("#lgSenha").value; if (!email || senha.length < 8) return telaLogin("Preencha o e-mail e uma senha de pelo menos 8 caracteres.");
      const {error} = await sb.auth.signUp({email, password:senha, options:{emailRedirectTo:location.origin + location.pathname}});
      telaLogin(error ? (error.message.includes("autorizado") || error.message.includes("Database") ? "Este e-mail não está autorizado." : error.message) : "Conta criada. Se chegar um e-mail de confirmação, clique no link e depois entre aqui."); }
    if (ev.target.id === "lgEsqueci") { const email = $("#lgEmail").value.trim(); if (!email) return telaLogin("Preencha o e-mail.");
      await sb.auth.resetPasswordForEmail(email, {redirectTo:location.origin + location.pathname}); telaLogin("Se o e-mail estiver cadastrado, chegará um link para trocar a senha."); }
    if (ev.target.id === "sair") { await sb.auth.signOut(); location.reload(); }
  });
  sb.auth.onAuthStateChange(async (evt) => { if (evt === "PASSWORD_RECOVERY") { const nova = window.prompt ? null : null;
    $("#main").innerHTML = `<div class="panel" style="max-width:380px;margin:40px auto"><h1 style="font-size:22px">Nova senha</h1><form id="novaSenha" class="grid"><label class="f">Nova senha<input id="nsSenha" type="password" minlength="8" required></label><button class="btn primary">Salvar senha</button></form></div>`; } });
  document.addEventListener("submit", async ev => { if (ev.target.id !== "novaSenha") return; ev.preventDefault(); const {error} = await sb.auth.updateUser({password:$("#nsSenha").value}); if (error) return toast(error.message); toast("Senha alterada"); entrar(sb); });
  entrar(sb);
}

iniciarWeb();
